# Ultra-low RAM & CPU Nginx config for Oracle Always Free VPS
# Place at: /etc/nginx/sites-available/image.cmoviez.com
# Enable:   sudo ln -s /etc/nginx/sites-available/image.cmoviez.com /etc/nginx/sites-enabled/
# Test:     sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name image.cmoviez.com;

    root /var/www/cmoviez-images;

    # Zero disk I/O logging overhead
    access_log off;
    error_log /var/log/nginx/image.cmoviez.com.error.log warn;

    # Kernel-level zero-copy static file serving (minimal RAM/CPU)
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    open_file_cache max=2000 inactive=120s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 1;
    open_file_cache_errors on;

    # Block directory listing and hidden files
    autoindex off;
    location ~ /\. {
        deny all;
    }

    # Serve only image formats with 1-year immutable caching (ideal behind Cloudflare)
    location ~* \.(webp|jpg|jpeg|png|avif|gif|svg|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        return 404;
    }
}
